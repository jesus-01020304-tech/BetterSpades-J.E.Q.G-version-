name: Build Android APK

on:
  push:
    branches:
      - standalone
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare SDL2 & Build APK
        run: |
          # 1. Clonar plantilla oficial de SDL2
          git clone --depth 1 https://github.com/libsdl-org/SDL.git -b SDL2
          
          # 2. Copiar proyecto Android
          cp -r SDL/android-project .
          
          # 3. Copiar fuentes de BetterSpades
          mkdir -p android-project/app/src/main/jni/src
          cp -r src/* android-project/app/src/main/jni/src/
          cp CMakeLists.txt android-project/app/src/main/jni/
          
          # 4. Configurar sdk.dir usando el SDK por defecto del sistema
          echo "sdk.dir=$ANDROID_HOME" > android-project/local.properties
          
          # 5. Compilar el APK con Gradle
          cd android-project
          chmod +x gradlew
          ./gradlew assembleDebug -PENABLE_SDL=ON -PENABLE_TOUCH=ON -PENABLE_OPENGLES=ON

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BetterSpades-Android-APK
          path: android-project/app/build/outputs/apk/debug/*.apk
          retention-days: 7
