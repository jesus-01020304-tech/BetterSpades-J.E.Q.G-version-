name: Build Android APK

on:
  push:
    branches:
      - standalone
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build build-essential

      - name: Build Native Binaries with CMake
        run: |
          # 1. Clonar SDL2 y OpenAL-Soft
          git clone --depth 1 https://github.com/libsdl-org/SDL.git -b SDL2
          git clone --depth 1 https://github.com/kcat/openal-soft.git
          
          # 2. Compilar SDL2 para Android arm64-v8a
          mkdir -p build-sdl
          cd build-sdl
          cmake ../SDL \
            -GNinja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DSDL_STATIC=OFF \
            -DSDL_SHARED=ON
          ninja
          cd ..

          # 3. Compilar OpenAL-Soft para Android arm64-v8a
          mkdir -p build-openal
          cd build-openal
          cmake ../openal-soft \
            -GNinja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DALSOFT_UTILS=OFF \
            -DALSOFT_EXAMPLES=OFF \
            -DALSOFT_TESTS=OFF
          ninja
          cd ..

          # 4. Compilar BetterSpades enlazando SDL2 y OpenAL
          mkdir -p build-app
          cd build-app
          cmake .. \
            -GNinja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DSDL2_DIR=$(pwd)/../build-sdl \
            -DSDL2_INCLUDE_DIR=$(pwd)/../SDL/include \
            -DOPENAL_INCLUDE_DIR=$(pwd)/../openal-soft/include \
            -DOPENAL_LIBRARY=$(pwd)/../build-openal/libopenal.so \
            -DENABLE_SDL=ON \
            -DENABLE_TOUCH=ON \
            -DENABLE_OPENGLES=ON \
            -DENABLE_ANDROID_FILE=ON \
            -DENABLE_GLFW=OFF
          ninja || true
          cd ..

      - name: Package and Sign APK
        run: |
          mkdir -p apk_structure/lib/arm64-v8a
          
          # Copiar librerias compiladas .so (SDL2, OpenAL y BetterSpades)
          find build-sdl build-openal build-app -name "*.so" -exec cp {} apk_structure/lib/arm64-v8a/ \;
          
          # Crear AndroidManifest.xml con permisos de audio
          cat << 'EOF' > apk_structure/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.betterspades.game"
              android:versionCode="1"
              android:versionName="1.0">
              <uses-sdk android:minSdkVersion="24" android:targetSdkVersion="34" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <application android:label="BetterSpades" android:hasCode="false">
                  <activity android:name="android.app.NativeActivity"
                      android:label="BetterSpades"
                      android:configChanges="orientation|keyboardHidden|screenSize"
                      android:exported="true">
                      <meta-data android:name="android.app.lib_name" android:value="main" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          PLATFORM="$ANDROID_HOME/platforms/android-34/android.jar"

          # Empaquetar APK
          $BUILD_TOOLS/aapt package -f -M apk_structure/AndroidManifest.xml -I $PLATFORM -F BetterSpades-unaligned.apk apk_structure/
          
          # Alinear APK
          $BUILD_TOOLS/zipalign -v 4 BetterSpades-unaligned.apk BetterSpades.apk
          
          # Generar clave y firmar APK
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          $BUILD_TOOLS/apksigner sign --ks debug.keystore --ks-pass pass:android BetterSpades.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BetterSpades-Android-APK
          path: BetterSpades.apk
          retention-days: 7
