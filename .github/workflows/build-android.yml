name: Build Android APK

on:
  push:
    branches:
      - standalone
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare SDL2 & Build APK
        run: |
          # 1. Clonar SDL2 oficial en su versión release/2.0
          git clone --depth 1 https://github.com/libsdl-org/SDL.git -b SDL2
          
          # 2. Preparar el proyecto Android de SDL2
          cp -r SDL/android-project .
          
          # 3. Vincular el código fuente de SDL2 y de BetterSpades en app/jni
          mkdir -p android-project/app/jni/src
          cp -r SDL android-project/app/jni/
          cp -r src/* android-project/app/jni/src/
          cp CMakeLists.txt android-project/app/jni/CMakeLists.txt
          
          # 4. Configurar local.properties e invalidar cualquier bloqueo estricto de NDK
          echo "sdk.dir=$ANDROID_HOME" > android-project/local.properties
          
          # 5. Compilar el archivo APK omitiendo el check de versión de NDK
          cd android-project
          chmod +x gradlew
          ./gradlew assembleDebug -Pandroid.overridePathCheck=true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BetterSpades-Android-APK
          path: android-project/app/build/outputs/apk/debug/*.apk
          retention-days: 7
